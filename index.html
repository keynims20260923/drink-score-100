<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>飲酒スコア 100</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:520px;margin:auto;padding:20px 16px 40px}
h1{font-size:24px;margin:6px 0 18px}
.card{background:white;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px #0000000d}
.score{text-align:center}
.score-num{font-size:54px;font-weight:800;line-height:1}
.score-num span{font-size:22px;font-weight:500;color:#6b7280}
.bar{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:18px 0 8px}
.fill{height:100%;width:0;background:#111827;border-radius:99px;transition:.25s}
.status{text-align:center;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:15px;background:#eef2ff;padding:15px 10px;font-size:16px;font-weight:700;color:#111827}
button:active{transform:scale(.98)}
button.water{background:#e0f2fe}
button.reset{background:#fee2e2;width:100%;margin-top:8px}
.drink{display:flex;justify-content:space-between;align-items:center}
.history{margin:0;padding:0;list-style:none}
.history li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.history li:last-child{border-bottom:0}
.small{font-size:13px;color:#6b7280}
.warning{display:none;background:#dc2626;color:white;border-radius:16px;padding:18px 12px;margin-top:12px;font-weight:800;font-size:20px;line-height:1.4;box-shadow:0 4px 12px #0003}.danger .score-num{color:#dc2626}.danger .fill{background:#dc2626!important}.water-count{margin-top:12px;font-size:18px;font-weight:800;background:#e0f2fe;padding:10px;border-radius:12px}
.limit{color:#b91c1c}
.settings{font-size:14px}
.settings input{width:64px;padding:8px;border:1px solid #d1d5db;border-radius:8px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
</style>
</head>
<body>
<main>
<h1>🍺 飲酒スコア 100</h1>

<section class="card score">
  <div class="small">今日のスコア</div>
  <div class="score-num" id="score">0<span> / 100</span></div>
  <div class="water-count" id="waterCount">💧 水 0杯</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status">まだ余裕あり</div>
  <div class="warning" id="warning">⚠️ 飲酒スコアが100点を超えています<br>これ以上飲まず、今日は終了。</div>
</section>

<section class="card">
  <div class="small" style="margin-bottom:10px">飲んだらタップ</div>
  <div class="grid" id="buttons"></div>
  <button class="water" style="width:100%;margin-top:10px;font-size:19px" onclick="addDrink('水・炭酸水',0)">💧 水を飲んだ！　＋1杯</button>
</section>

<section class="card">
  <div class="drink"><b>今日の履歴</b><span class="small" id="count">0杯</span></div>
  <ul class="history" id="history"></ul>
  <button class="reset" onclick="resetDay()">今日の記録をリセット</button>
</section>

<section class="card settings">
  <b>⚙️ 点数設定</b>
  <div id="settings"></div>
</section>
</main>

<script>
const defaults=[
 ["ワイン",25],["ウイスキーロック",25],["日本酒",20],
 ["ビール",15],["ハイボール",15],["サワー",10],["梅酒ロック",10]
];
let drinks=JSON.parse(localStorage.getItem("drinkSettings")||"null")||defaults;
let state=JSON.parse(localStorage.getItem("drinkState")||"null")||{date:new Date().toLocaleDateString("ja-JP"),score:0,history:[]};
const today=new Date().toLocaleDateString("ja-JP");
if(state.date!==today){state={date:today,score:0,history:[]};save();}
function save(){localStorage.setItem("drinkState",JSON.stringify(state));localStorage.setItem("drinkSettings",JSON.stringify(drinks));}
function render(){
 document.getElementById("score").innerHTML=`${state.score}<span> / 100</span>`;
 document.getElementById("fill").style.width=Math.min(state.score,100)+"%";
 document.getElementById("fill").style.background=state.score>=100?"#b91c1c":"#111827";
 let status=state.score>=100?"今日は終了":state.score>=80?"そろそろ終了":state.score>=60?"水をはさもう":"まだ余裕あり";
 document.getElementById("status").textContent=status;
 document.getElementById("status").className="status "+(state.score>=80?"limit":"");
 document.getElementById("warning").style.display=state.score>=100?"block":"none";
 document.querySelector(".score").classList.toggle("danger",state.score>=100);
 document.getElementById("waterCount").textContent="💧 水 "+state.history.filter(x=>x.points===0).length+"杯";
 document.getElementById("count").textContent=state.history.filter(x=>x.points>0).length+"杯";
 document.getElementById("buttons").innerHTML=drinks.map((d,i)=>`<button onclick="addDrink(${i})">${d[0]}<br><span class="small">＋${d[1]}点</span></button>`).join("");
 document.getElementById("history").innerHTML=state.history.length?state.history.slice().reverse().map(x=>`<li><span>${x.name}</span><b>${x.points?"+":""}${x.points}点</b></li>`).join(""):'<li class="small">まだ記録なし</li>';
 document.getElementById("settings").innerHTML=drinks.map((d,i)=>`<div class="row"><span>${d[0]}</span><input type="number" min="0" value="${d[1]}" onchange="setPoint(${i},this.value)">点</div>`).join("");
}
function addDrink(i,p){
 if(typeof i==="string"){let n=i; state.history.push({name:n,points:p});}
 else {let d=drinks[i];state.score+=Number(d[1]);state.history.push({name:d[0],points:Number(d[1])});}
 save();render();
}
function resetDay(){if(confirm("今日の記録を全部リセットしますか？")){state={date:today,score:0,history:[]};save();render();}}
function setPoint(i,v){drinks[i][1]=Math.max(0,Number(v));save();render();}
render();
</script>
</body>
</html>
